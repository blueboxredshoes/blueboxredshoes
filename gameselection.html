<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Selection</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace;
      background: #101010;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #title {
        margin-top: 40px;
          border: 1px dotted white;
      border-radius: 1em;
        padding: 15px;
        font-size: 13px;
    }
    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 5vw;
      width: 90vw;
      max-width: 1200px;
      margin: 5vh auto;
    }
    .game-card {
      min-width: 200px;
      flex: 1 1 250px;
      max-width: 250px;
      box-sizing: border-box;
      text-align: center;
      padding: 1em;
    }
   
    img {
      max-width: 100%;
      height: auto;
    }
    @media (max-width: 700px) {
      .container {
        flex-direction: column;
        gap: 4vw;
      }
      .game-card {
        max-width: 90vw;
      }
    }

    #deer {
    margin-top: 30px;
    }

#party {
    margin-top: 30px;
}

    #party img {
    width: 90%;
     height: auto;
    }

    #fireworks {
    margin-top: 30px;
    }

  </style>
</head>
<body>
    <div id = "title">
  <h1>Project Selection</h1>
    </div>
  <div class="container">
    <div class="game-card">
        <div id = "deer">
        <a href="deer.html">
      <img src="deer1.jpg" alt="Game 1">
        </a>
      <p>DEER IN HEADLIGHTS: ACT I</p>
      </div>
    </div>

    <div class="game-card">
        <div id = "fireworks">
      <a href="fireworks.html">
      <img src="countdown2.jpg" alt="Game 2">
      </a>
      <p>SEE YOU NEXT YEAR</p>
</div>
    </div>

    <div class="game-card">
        <div id = "party">
      <a href="party.html">
      <img src="party.png" alt="Game 3">
      </a>
      <p>a party went wandering</p>
      </div>
    </div>
  </div>
</body>
</html>
