<!DOCTYPE html>
<html lang="en">
  <head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
  </head>

  <body>
    <style> 
        body, html {
            background-color:#101010; 
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
    }
    
    .container {
        display: flex;
            flex-wrap: nowrap;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            width: 100%;
            overflow-x: auto;
            margin: 10px 0;
    }
    
    video {
        margin: 10px;
        max-width: 100%;
        height: auto;
    }
    </style>

<div class="container">

    <div id = "starstruck">
        <video width = "300px" height = "300px" 
            controls loop src = "starstruck.mp4" type="video/mp4">
        </video>
    </div>

    <div id = "bird">
        <video width = "300px" height = "300px" 
            controls loop src = "bird+projector.mp4" type="video/mp4">
        </video>
    </div>

    <div id = "cowboy">
        <video width = "300px" height = "300px" 
            controls loop src = "cowboy.mp4" type="video/mp4">
        </video>
    </div>

    <div id = "bird2">
        <video width = "300px" height = "300px" 
            controls loop src = "birdflipbook.mp4" type="video/mp4">
        </video>
    </div>

    <div id = "deer">
        <video width = "300px" height = "300px" 
            controls loop src = "deer2.mp4".mp4" type="video/mp4">
        </video>
    </div>

</div>

</body>
</html>
